[project]
name = "lsmas"
version = "0.1.0"
description = "Parameter reduction for calibrating the SIPNET land-surface model at Harvard Forest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pinned to commits: these packages are in active development. See the README for how to upgrade.
    "probpipe-core @ git+https://github.com/TARPS-group/prob-pipe.git@9158a50e7ae9d60d21f57ebc10889605026cbd26",
    "enskit @ git+https://github.com/TARPS-group/EnsKit.git@f7dc7eea0575b4d3b2fce91eee1eb69afb1c9341",
    "pysipnet @ git+https://github.com/TARPS-group/pySIPNET.git@08bab7b04cf281b4c4b5e41ca18bbd604d30e46f",
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.0",
    "xarray>=2024.1",
    "pydantic>=2",
    "matplotlib>=3.8",
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "arviz>=1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/lsmas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: end-to-end checks that run SIPNET or a notebook (a few minutes in total)",
]
filterwarnings = [
    "ignore:Explicitly requested dtype:UserWarning",
    "ignore:shape requires ndarray or scalar arguments:DeprecationWarning",
    "ignore:jax.core.pytype_aval_mappings is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["design/prototypes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Greek letters and math symbols in docstrings are intended
